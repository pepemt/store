[project]
name = "api"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.11,<3.13"
dependencies = [
  "images",
  "text",
  "database",
  "fastapi>=0.116.1",
  "uvicorn[standard]>=0.35.0",
  "colorlog>=6.9.0",
  "python-dotenv>=1.1.0",
  "sqlalchemy>=2.0.0",
  "asyncpg>=0.29.0",
  "psycopg2-binary>=2.9.0",
  "email-validator>=2.0.0",
  "pydantic[email]>=2.0.0",
  "python-jose[cryptography]>=3.3.0",
  "passlib[bcrypt]>=1.7.4",
  "python-multipart>=0.0.5",
  "langchain-community>=0.3.0",
  "oci>=2.126.0",
  "langgraph>=1.0.1",
  "boto3>=1.34.0",
  "aioboto3>=12.3.0",
  "requests>=2.31.0",
  "pillow>=10.0.0",
  "diskcache>=5.6.3",
  "stripe>=7.0.0",
]

[project.scripts]
api = "api.main:main"
create-cart-table = "create_cart_table:main"
test-cart = "test_cart:main"

[tool.uv.sources]
images = { workspace = true }
text = { workspace = true }
database = { workspace = true }

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["api"]
package-dir = {"api" = "src"}
