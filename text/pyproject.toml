[project]
name = "text"
version = "0.1.0"
description = "Term-based semantic search for product discovery"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.0",
    "sentence-transformers>=2.5.0",
    "oracledb>=2.2.0",
    "stop-words>=2018.7.23",
]

[project.scripts]
text = "text.main:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["text"]
package-dir = {"text" = "."}