services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: minio
    restart: unless-stopped
    ports:
      - "9000:9000"  # MinIO API
      - "9001:9001"  # MinIO Console
    volumes:
      - ./.data/s3:/data:rw
    env_file: .env.minio
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  create-bucket-mlflow:
    image: minio/mc:latest
    container_name: create-bucket-mlflow
    depends_on:
      minio:
        condition: service_healthy
    env_file: .env.mlflow
    entrypoint: >
      /bin/sh -c "
        mc alias set myminio http://$$MINIO_HOST:$$MINIO_PORT $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
        mc mb --ignore-existing myminio/$$MINIO_BUCKET
      "
    restart: "no"

  postgresql:
    image: postgres:15
    container_name: postgresql
    restart: unless-stopped
    ports:
      - "5432:5432"  # PostgreSQL
    volumes:
      - ./.data/postgresql:/var/lib/postgresql/data:rw
    env_file: .env.postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  create-db-mlflow:
    image: postgres:15
    container_name: create-db-mlflow
    depends_on:
      postgresql:
        condition: service_healthy
    env_file:
      - .env.postgresql
    entrypoint: >
      /bin/sh -c "
        export PGPASSWORD=$$POSTGRES_PASSWORD &&
        psql -h postgresql -U $$POSTGRES_USER -d postgres -tc \"SELECT 1 FROM pg_database WHERE datname = 'mlflow'\" | grep -q 1 ||
        psql -h postgresql -U $$POSTGRES_USER -d postgres -c \"CREATE DATABASE mlflow\"
      "
    restart: "no"

  chroma:
    image: chromadb/chroma:1.1.1
    container_name: chroma
    restart: unless-stopped
    ports:
      - "8000:8000"  # ChromaDB API
    volumes:
      - ./.data/chroma:/chroma/chroma:rw
    env_file: .env.chroma
   
  mlflow:
    image: ghcr.io/mlflow/mlflow
    container_name: mlflow-server
    restart: unless-stopped
    depends_on:
      create-db-mlflow:
        condition: service_completed_successfully
      create-bucket-mlflow:
        condition: service_completed_successfully
    command: >
      /bin/bash -c "
        pip install --no-cache-dir psycopg2-binary boto3 &&
        mlflow server \
          --backend-store-uri $$MLFLOW_BACKEND_STORE_URI \
          --default-artifact-root $$MLFLOW_DEFAULT_ARTIFACT_ROOT \
          --host $$MLFLOW_HOST \
          --port $$MLFLOW_PORT \
          --app-name mlflow-server
          "
    ports:
      - "5000:5000"
    env_file: .env.mlflow
    environment:
      - AWS_ACCESS_KEY_ID=$${MINIO_ROOT_USER}
      - AWS_SECRET_ACCESS_KEY=$${MINIO_ROOT_PASSWORD}
      - MLFLOW_S3_ENDPOINT_URL=$${MLFLOW_S3_ENDPOINT_URL}
      - MLFLOW_SERVER_DISABLE_SECURITY_MIDDLEWARE=true