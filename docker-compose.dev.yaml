services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: minio
    restart: unless-stopped
    ports:
      - "9000:9000"  # MinIO API
      - "9001:9001"  # MinIO Console
    volumes:
      - ./.data/s3:/data:rw
    env_file: .env
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  create-bucket-mlflow:
    image: minio/mc:latest
    container_name: create-bucket-mlflow
    depends_on:
      minio:
        condition: service_healthy
    env_file: .env
    entrypoint: >
      /bin/sh -c "
        mc alias set myminio http://$$MINIO_HOST:$$MINIO_PORT $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
        mc mb --ignore-existing myminio/$$MINIO_BUCKET
      "
    restart: "no"

  mlflow:
    image: ghcr.io/mlflow/mlflow
    container_name: mlflow-server
    restart: unless-stopped
    depends_on:
      minio:
        condition: service_healthy
      create-bucket-mlflow:
        condition: service_completed_successfully
    command: >
      /bin/bash -c "
        pip install --no-cache-dir psycopg2-binary boto3 &&
        mlflow server \
          --backend-store-uri $$MLFLOW_BACKEND_STORE_URI \
          --default-artifact-root $$MLFLOW_DEFAULT_ARTIFACT_ROOT \
          --host $$MLFLOW_HOST \
          --port $$MLFLOW_PORT \
          --app-name mlflow-server
          "
    ports:
      - "5000:5000"
    env_file: .env
    environment:
      - AWS_ACCESS_KEY_ID=$${MLFLOW_S3_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=$${MLFLOW_S3_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=$${MLFLOW_S3_REGION}
      - MLFLOW_S3_ENDPOINT_URL=$${MLFLOW_S3_ENDPOINT_URL}
      - MLFLOW_SERVER_DISABLE_SECURITY_MIDDLEWARE=true