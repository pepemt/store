[project]
name = "initialization"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.11"
dependencies = [
    "colorlog>=6.9.0",
    "database",
    "text",
    "pandas>=2.3.3",
    "python-dotenv>=1.1.0"
]

[project.scripts]
initialization = "initialization.main:main"

[tool.uv.sources]
database = { workspace = true }
text = { workspace = true }

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["initialization"]
package-dir = {"initialization" = "src"}
